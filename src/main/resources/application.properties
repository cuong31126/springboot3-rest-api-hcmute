# ==========================================
# Server Configuration
# ==========================================
server.port=8080
server.servlet.context-path=/

# ==========================================
# Database Configuration (Microsoft SQL Server)
# Cấu hình kết nối SQL Server (Thay đổi tên database, username, password tương ứng)
# ==========================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=VietApiDb;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=caucuong
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Giữ nguyên tên cột dạng camelCase (categoryId, categoryName...) không đổi thành snake_case (category_id)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==========================================
# File Upload Configuration
# ==========================================
# Giới hạn kích thước file upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
# Thư mục lưu trữ file upload (theo StorageProperties)
storage.location=uploads

# ==========================================
# SpringDoc OpenAPI 3 / Swagger Configuration
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ==========================================
# Spring MVC View Configuration for JSP
# ==========================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ==========================================
# Spring Boot DevTools (Auto Reload / Hot Swap)
# ==========================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
# Tắt cache template/static để sửa html/jsp nhận ngay lập tức
spring.thymeleaf.cache=false
